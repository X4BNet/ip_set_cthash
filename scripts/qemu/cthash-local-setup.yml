- hosts: filtering
  become: yes
  vars:
    module_dir: /tmp/ip-set-cthash-local-build
  tasks:
    - name: install build and test dependencies
      apt:
        name: [build-essential, dkms, ipset]
        state: present
        update_cache: yes
    - name: replace guest build directory
      file:
        path: "{{ module_dir }}"
        state: absent
    - name: copy module source to guest
      shell: >
        tar -C /module-src -cf - src scripts/qemu |
        sshpass -p '{{ ansible_ssh_pass }}' ssh -o StrictHostKeyChecking=no
        {{ ansible_user }}@{{ inventory_hostname }}
        "sudo mkdir -p {{ module_dir }} && sudo tar -xf - -C {{ module_dir }}"
      delegate_to: localhost
    - name: build and install module against running kernel
      shell: |
        set -euo pipefail
        KVERSION="$(uname -r)" ./install-dkms.sh --install
        modprobe ip_set_cthash_ipport
      args:
        executable: /bin/bash
        chdir: "{{ module_dir }}/src"
